name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Build info
      description: Settings → About → Build → Copy
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Any lines you've changed in ~/.config/reel/config
      render: ini
